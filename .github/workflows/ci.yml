name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: difflens
          POSTGRES_PASSWORD: difflens
          POSTGRES_DB: difflens
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+psycopg://difflens:difflens@localhost:5432/difflens
      TEST_DATABASE_URL: postgresql+psycopg://difflens:difflens@localhost:5432/difflens_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/eslint-runtime/package-lock.json
      # The ESLint analyzer shells out to this install. Without it the
      # TypeScript tests skip themselves rather than fail, which would hide
      # a broken adapter, so CI always provides it.
      - name: Install the ESLint analyzer runtime
        run: npm ci --omit=dev --no-audit --no-fund
        working-directory: api/eslint-runtime
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - name: Tests (unit, analysis, authz, integration)
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
