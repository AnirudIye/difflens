name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: difflens
          POSTGRES_PASSWORD: difflens
          POSTGRES_DB: difflens
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+psycopg://difflens:difflens@localhost:5432/difflens
      TEST_DATABASE_URL: postgresql+psycopg://difflens:difflens@localhost:5432/difflens_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/eslint-runtime/package-lock.json
      # The ESLint analyzer shells out to this install. Without it the
      # TypeScript tests skip themselves rather than fail, which would hide
      # a broken adapter, so CI always provides it.
      - name: Install the ESLint analyzer runtime
        run: npm ci --omit=dev --no-audit --no-fund
        working-directory: api/eslint-runtime
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - name: Tests (unit, analysis, authz, integration)
        run: uv run pytest

  image:
    # The Dockerfile is a deploy artifact and nothing else exercises it: the
    # backend job runs the code natively, so a broken image reached Render
    # before anyone noticed. This builds what Render builds, with the same
    # context, and then proves the two things the build cannot prove about
    # itself: that the analyzer's runtime resolves inside the image, and that
    # the app imports under the interpreter the image actually ships.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image Render builds
        uses: docker/build-push-action@v6
        with:
          context: ./api # matches dockerContext in render.yaml
          file: ./api/Dockerfile
          load: true
          tags: difflens-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The ESLint analyzer is reachable from inside the image
        run: |
          docker run --rm difflens-api:ci python -c "
          from app.analysis.analyzers.eslint_adapter import RUNTIME_DIR, eslint_is_available, eslint_version
          print('runtime dir:', RUNTIME_DIR)
          assert str(RUNTIME_DIR) == '/srv/eslint-runtime', RUNTIME_DIR
          assert eslint_is_available(), 'node or the eslint install is missing from the image'
          print('eslint:', eslint_version())
          "
      - name: The app imports and migrations are present
        run: |
          docker run --rm difflens-api:ci python -c "import app.main; print('app imports')"
          docker run --rm difflens-api:ci sh -c "test -f alembic.ini && test -d alembic && echo 'migrations present'"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
