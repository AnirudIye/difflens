# Dependency updates. Grouped and capped on purpose: an unattended portfolio
# repo that opens fifteen single-package pull requests a week stops getting
# read, and an unread security update is the same as no security update.
#
# Secret scanning and push protection are repository settings, not files, and
# are enabled in Settings > Code security. docs/THREAT_MODEL.md records that.
version: 2
updates:
  - package-ecosystem: pip # reads api/pyproject.toml; there is no uv.lock to read
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, python]

  - package-ecosystem: npm
    directory: /api/eslint-runtime # ESLint itself, which the analyzer executes
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      eslint-runtime:
        patterns: ["*"]
    labels: [dependencies, javascript]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      node-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, javascript]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directory: /api # the Render runtime image
    schedule:
      interval: weekly
    labels: [dependencies, docker]
