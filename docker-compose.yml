# Local infrastructure for DiffLens.
#
# Plain `docker compose up -d` starts only Postgres and Redis; the API and
# web app run natively (uv / npm) for fast reloads on Windows.
# `docker compose --profile full up -d` additionally builds and runs the
# API container to exercise that path.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: difflens
      POSTGRES_PASSWORD: difflens
      POSTGRES_DB: difflens
    # Published on 55432 so a locally installed PostgreSQL on 5432 never
    # races this container for the port.
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U difflens -d difflens"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Only starts with: docker compose --profile full up -d
  api:
    build: ./api
    profiles: ["full"]
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # No worker service yet: the worker lands Day 5 and runs co-located with
  # the API in production. No web service: Next.js runs natively / on Vercel.

volumes:
  pgdata:
