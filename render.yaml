# Render Blueprint for the DiffLens API (the FastAPI backend).
# Deploy: push this repo, then in the Render dashboard "New +" -> "Blueprint"
# and point it at the repo. Render reads this file and provisions the service.
#
# Secrets marked `sync: false` are NOT stored here (never commit secrets) - set
# them once in the service's Environment tab. What each value is and where it
# comes from is in docs/DEPLOYMENT.md.
services:
  - type: web
    name: difflens-api
    runtime: docker
    plan: free # bump to "starter" ($7/mo) to avoid free-tier cold starts
    region: oregon
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    # start.sh in the image runs `alembic upgrade head` before uvicorn, so
    # migrations happen on every deploy without a preDeployCommand (which the
    # free plan does not support).
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      # --- Set these yourself in the Environment tab (sync: false) ---
      - key: DATABASE_URL # Neon pooled string: postgresql+psycopg://USER:PASS@HOST/db?sslmode=require
        sync: false
      - key: GITHUB_CLIENT_ID # the production OAuth app, not the dev one
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET # fresh prod value; generation command in docs/DEPLOYMENT.md
        sync: false
      - key: TOKEN_ENCRYPTION_KEY # fresh prod Fernet key; do not reuse dev
        sync: false
      - key: FRONTEND_ORIGIN # the Vercel URL, e.g. https://difflens.vercel.app
        sync: false
      - key: REDIS_URL # Upstash rediss:// string; with a bad value the worker
        sync: false # degrades to polling Postgres every 25s instead of BRPOP
      # sync: false on purpose. A literal value here is blueprint-managed, so
      # every deploy overwrites whatever is set in the Environment tab, which
      # silently downgraded production to the mock provider once already.
      # Leaving them unset behaves exactly as before: config.py defaults to
      # AI_PROVIDER=mock and an empty AI_MODEL.
      - key: AI_PROVIDER # mock | gemini | anthropic | openai; gemini + a free AI Studio key
        sync: false # is the zero-cost way to run real reviews
      - key: AI_MODEL # empty = provider default
        # (gemini-3.6-flash / claude-opus-5 / gpt-5.6-terra)
        sync: false
      - key: GEMINI_API_KEY # aistudio.google.com/apikey; only read when AI_PROVIDER=gemini
        sync: false
      - key: ANTHROPIC_API_KEY # console.anthropic.com; only read when AI_PROVIDER=anthropic
        sync: false
      - key: OPENAI_API_KEY # platform.openai.com; only read when AI_PROVIDER=openai
        sync: false
      # The public demo. sync: false like everything else the operator owns,
      # so turning the demo off in the dashboard survives the next deploy.
      # Unset behaves as off: config.py defaults DEMO_MODE to false.
      - key: DEMO_MODE # 1 enables /demo and seeds its rows at boot
        sync: false
