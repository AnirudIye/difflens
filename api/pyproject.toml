[project]
name = "difflens-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "cryptography>=43",
    "httpx>=0.27",
    "unidiff==1.0.0",
    "tree-sitter>=0.24",
    # 1.x downloads grammars over the network at parse time, which breaks the
    # pure-analysis rule (and its cache rename fails across Windows drives);
    # 0.x bundles every grammar in the wheel
    "tree-sitter-language-pack<1",
    "detect-secrets==1.5.0",
    # the deployed pipeline shells out to ruff, so it is a runtime dependency,
    # and its exact output is what the golden fixtures assert. Pinned for the
    # same reason detect-secrets is: a linter whose output is the contract is
    # upgraded deliberately, with the goldens re-checked, never by resolution.
    # ESLint, its counterpart, is already locked by eslint-runtime's lockfile.
    "ruff==0.16.3",
    "redis>=5.0",
    # Both bounds are load-bearing. 1.0 moved the SDK off httpx onto httpx2, so
    # an httpx.Client is rejected at runtime, not merely by the type checker.
    # The floor is where `fallbacks` appears on beta.messages.create: 0.107.1
    # does not have it and 0.108.0 does (checked by reading
    # resources/beta/messages/messages.py in each wheel), and AnthropicProvider
    # passes it on every call. The old >=0.79 floor admitted versions that
    # install cleanly and then raise TypeError on the first real review, on the
    # one provider with no live-API coverage to catch it.
    "anthropic>=0.108,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    # Pinned for the same reason as ruff, and it is the more urgent of the two:
    # pyright is a hard CI gate whose diagnostics change between releases, so a
    # float here turns main red on a commit that changed nothing. That is not
    # hypothetical, it is what happened on 2026-08-21 with a different unpinned
    # dependency. Upgrade deliberately, with the type errors read.
    "pyright==1.1.411",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "worker"]

[tool.ruff]
line-length = 100
# fixture workspaces and the demo sample contain deliberately buggy code the
# pipeline must find; linting them here would fail on the bugs that are the point
extend-exclude = ["tests/fixtures", "app/demo/sample/files"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# The local alembic/ directory shadows the installed package for import sorting
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# conftest must pin env vars before importing app modules
"tests/conftest.py" = ["E402"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = ["app", "tests", "worker"]
exclude = ["tests/fixtures", "app/demo/sample/files"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# fixture workspaces contain files named test_*.py that are not our tests
norecursedirs = ["fixtures"]
