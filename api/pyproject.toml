[project]
name = "difflens-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "cryptography>=43",
    "httpx>=0.27",
    "unidiff==1.0.0",
    "tree-sitter>=0.24",
    # 1.x downloads grammars over the network at parse time, which breaks the
    # pure-analysis rule (and its cache rename fails across Windows drives);
    # 0.x bundles every grammar in the wheel
    "tree-sitter-language-pack<1",
    "detect-secrets==1.5.0",
    # the deployed pipeline shells out to ruff, so it is a runtime dependency
    "ruff>=0.12",
    "redis>=5.0",
    "anthropic>=0.79",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "worker"]

[tool.ruff]
line-length = 100
# fixture workspaces contain deliberately buggy code the pipeline must find
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# The local alembic/ directory shadows the installed package for import sorting
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# conftest must pin env vars before importing app modules
"tests/conftest.py" = ["E402"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = ["app", "tests", "worker"]
exclude = ["tests/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# fixture workspaces contain files named test_*.py that are not our tests
norecursedirs = ["fixtures"]
